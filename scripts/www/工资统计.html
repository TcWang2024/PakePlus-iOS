<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>工资统计 · 一键截图</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f7 100%);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 32px 24px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.8);
            padding: 32px 36px 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-header .brand .icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #1f3a5e, #2d6bb8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px 16px -6px rgba(45, 107, 184, 0.3);
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0b2b4a;
            letter-spacing: -0.4px;
        }

        .app-header h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #5a7a9e;
            margin-left: 6px;
        }

        .header-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-badge {
            background: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #1f3a5e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== 布局：两列 ===== */
        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        @media (max-width: 820px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== 卡片 ===== */
        .card {
            background: white;
            border-radius: 28px;
            padding: 20px 24px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-weight: 600;
            font-size: 15px;
            color: #1f3a5e;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title .badge {
            background: #eef3f9;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            color: #1f3a5e;
        }

        .card .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }

        .card .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 0 120px;
        }

        .card .input-group label {
            font-size: 12px;
            font-weight: 500;
            color: #5a7a9e;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .card .input-group input {
            padding: 8px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            background: #fafcff;
            transition: 0.15s;
            width: 100%;
        }

        .card .input-group input:focus {
            border-color: #2d6bb8;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 107, 184, 0.08);
            background: white;
        }

        /* ===== 按钮 ===== */
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: #1f3a5e;
            color: white;
            box-shadow: 0 4px 10px rgba(31, 58, 94, 0.15);
        }
        .btn-primary:hover {
            background: #143049;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(31, 58, 94, 0.2);
        }

        .btn-outline {
            background: transparent;
            border-color: #d7dfe9;
            color: #1f3a5e;
        }
        .btn-outline:hover {
            background: #f0f4fa;
            border-color: #a0b4cc;
        }

        .btn-success {
            background: #1e7b4b;
            color: white;
            box-shadow: 0 4px 10px rgba(30, 123, 75, 0.15);
        }
        .btn-success:hover {
            background: #14633b;
            transform: translateY(-1px);
        }

        .btn-warning {
            background: #d4a02b;
            color: white;
            box-shadow: 0 4px 10px rgba(212, 160, 43, 0.15);
        }
        .btn-warning:hover {
            background: #b8891e;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #b13e3e;
            color: white;
        }
        .btn-danger:hover {
            background: #922f2f;
        }

        .btn-screenshot {
            background: #2d6bb8;
            color: white;
            box-shadow: 0 4px 12px rgba(45, 107, 184, 0.25);
            padding: 10px 28px;
            font-size: 14px;
        }
        .btn-screenshot:hover {
            background: #1f4f8a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(45, 107, 184, 0.3);
        }

        .btn-sm {
            padding: 5px 14px;
            font-size: 12px;
        }

        /* ===== 标签 (chip) ===== */
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding-top: 10px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f6faff;
            padding: 4px 10px 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid #e2e8f0;
            transition: 0.1s;
            flex-wrap: wrap;
        }

        .chip .chip-input {
            border: none;
            background: transparent;
            font-size: 13px;
            padding: 2px 4px;
            width: auto;
            min-width: 36px;
            border-bottom: 1px dashed transparent;
            transition: 0.15s;
            font-weight: 500;
            color: #0b2b4a;
        }

        .chip .chip-input:focus {
            outline: none;
            border-bottom-color: #2d6bb8;
            background: #f0f7ff;
            border-radius: 4px 4px 0 0;
        }

        .chip .chip-input.price-input {
            min-width: 44px;
            color: #1e7b4b;
            font-weight: 600;
        }

        .chip .remove {
            color: #8fa2bb;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            margin-left: 2px;
            transition: 0.1s;
            border-radius: 30px;
            padding: 0 2px;
        }
        .chip .remove:hover {
            color: #b13e3e;
            background: #fce8e8;
        }

        .chip .price-tag {
            background: #eef3f9;
            padding: 0 8px;
            border-radius: 30px;
            font-size: 11px;
            color: #1f3a5e;
            font-weight: 500;
        }

        /* ===== 矩阵表格 ===== */
        .matrix-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9edf4;
            background: white;
            margin-top: 4px;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 480px;
        }

        .matrix-table th {
            background: #f2f7ff;
            color: #1f3a5e;
            font-weight: 600;
            padding: 10px 8px;
            text-align: center;
            border-bottom: 2px solid #dde4ef;
            white-space: nowrap;
            font-size: 12px;
        }

        .matrix-table th:first-child {
            text-align: center;
            padding-left: 16px;
            min-width: 80px;
        }

        .matrix-table td {
            padding: 5px 4px;
            border-bottom: 1px solid #edf2f8;
            text-align: center;
            vertical-align: middle;
        }

        .matrix-table td:first-child {
            text-align: center;
            padding-left: 16px;
            font-weight: 700;
            font-size: 16px;
            color: #0b2b4a;
            background: #fafcff;
        }

        .matrix-table tr:last-child td {
            border-bottom: none;
        }

        .matrix-table input[type="number"] {
            width: 64px;
            padding: 5px 2px;
            border: 1px solid #d7dfe9;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            background: white;
            transition: 0.15s;
        }

        .matrix-table input[type="number"]:focus {
            border-color: #2d6bb8;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 107, 184, 0.08);
        }

        .matrix-table input[type="number"]:disabled {
            background: #f4f7fc;
            color: #8fa2bb;
            border-color: #e2e8f0;
        }

        .matrix-table .worker-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
        }

        .matrix-table .total-col {
            font-weight: 600;
            color: #0b2b4a;
            background: #f6faff;
            border-radius: 30px;
            padding: 2px 10px;
            font-size: 13px;
        }

        .matrix-table .summary-row td {
            background: #f2f7ff;
            font-weight: 600;
            color: #0b2b4a;
            border-top: 2px solid #dde4ef;
        }

        .matrix-table .summary-row td:first-child {
            background: #f2f7ff;
        }

        .matrix-table .unit-suffix {
            font-size: 11px;
            color: #5a7a9e;
            font-weight: 400;
            margin-left: 1px;
        }

        /* ===== 底部区域 ===== */
        .bottom-section {
            margin-top: 28px;
            border-top: 2px solid #eef3f9;
            padding-top: 24px;
        }

        .bottom-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .bottom-toolbar .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bottom-toolbar .left .label {
            font-weight: 600;
            font-size: 17px;
            color: #0b2b4a;
        }

        .bottom-toolbar .left .hint {
            font-size: 12px;
            color: #5a7a9e;
            background: #eef3f9;
            padding: 2px 14px;
            border-radius: 30px;
        }

        .bottom-toolbar .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .file-upload-wrapper input[type="file"] {
            display: none;
        }

        .screenshot-row {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        /* ===== 工资卡片 - 竖线对齐 ===== */
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 580px;
        }

        .worker-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e9edf4;
            padding: 12px 16px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            width: 100%;
        }

        .worker-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #e3eaf3;
            padding-bottom: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .worker-card-header .worker-name {
            font-size: 18px;
            font-weight: 700;
            color: #0b2b4a;
        }

        .worker-card-header .total {
            background: #d7e5f5;
            padding: 0 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            color: #0b2b4a;
        }

        .worker-card-header .total .label {
            font-weight: 400;
            font-size: 11px;
            color: #4d6a8f;
            margin-right: 3px;
        }

        .worker-detail {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
        }

        .worker-detail .item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0;
            background: #f8faff;
            padding: 5px 14px 5px 16px;
            border-radius: 30px;
            border: 1px solid #e9edf4;
            flex-wrap: nowrap;
        }

        .worker-detail .item .field-group {
            display: flex;
            align-items: center;
            gap: 2px 6px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }

        .worker-detail .item .field-group.product-group {
            min-width: 100px;
        }

        .worker-detail .item .field-group.price-group {
            min-width: 90px;
        }

        .worker-detail .item .field-group.qty-group {
            min-width: 80px;
        }

        .worker-detail .item .field-label {
            color: #5a7a9e;
            font-size: 11px;
            font-weight: 400;
            min-width: 24px;
        }

        .worker-detail .item .field-value {
            font-weight: 500;
            color: #0b2b4a;
            font-size: 14px;
        }

        .worker-detail .item .field-value.price-val {
            color: #1f3a5e;
        }

        .worker-detail .item .field-value.qty-val {
            background: #eef3f9;
            padding: 0 8px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .worker-detail .item .amount {
            font-weight: 700;
            color: #1e7b4b;
            margin-left: auto;
            font-size: 15px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .worker-detail .item .divider {
            color: #c8d6e0;
            font-size: 16px;
            font-weight: 300;
            flex-shrink: 0;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            text-align: center;
        }

        .unit-suffix {
            font-size: 11px;
            color: #5a7a9e;
            font-weight: 400;
        }

        /* ===== 汇总条 ===== */
        .summary-bar {
            background: #f2f6fe;
            border-radius: 16px;
            padding: 10px 20px;
            margin-top: 6px;
            border: 1px solid #e3eaf3;
            font-size: 16px;
            font-weight: 600;
            color: #0b2b4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 580px;
        }

        .summary-bar .total-value {
            background: #1f3a5e;
            color: white;
            padding: 2px 20px;
            border-radius: 40px;
            font-size: 17px;
        }

        .stats-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }

        .empty-message {
            color: #8fa2bb;
            padding: 24px 10px;
            text-align: center;
            font-size: 14px;
        }

        /* ===== 截图专用样式 - 高清清晰 ===== */
        .screenshot-export {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px 28px;
            background: #ffffff;
            max-width: 620px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .screenshot-export .report-title {
            text-align: center;
            color: #0b2b4a;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .screenshot-export .report-date {
            text-align: center;
            color: #5a7a9e;
            font-size: 13px;
            margin-bottom: 18px;
            font-weight: 400;
        }

        .screenshot-export .export-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .screenshot-export .export-table th {
            background: #f2f7ff;
            padding: 8px 12px;
            text-align: center;
            border-bottom: 2px solid #dde4ef;
            font-weight: 700;
            color: #1f3a5e;
            font-size: 12px;
        }

        .screenshot-export .export-table td {
            padding: 6px 12px;
            text-align: center;
            border-bottom: 1px solid #edf2f8;
            font-size: 13px;
            color: #0b2b4a;
        }

        .screenshot-export .export-table .total-row td {
            background: #f2f7ff;
            font-weight: 700;
            border-top: 2px solid #dde4ef;
            font-size: 13px;
        }

        .screenshot-export .export-section-title {
            font-size: 18px;
            font-weight: 700;
            color: #0b2b4a;
            margin-bottom: 12px;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .screenshot-export .export-worker-card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 18px 14px;
            margin-bottom: 8px;
            background: white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .screenshot-export .export-worker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #e3eaf3;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .screenshot-export .export-worker-name {
            font-weight: 700;
            font-size: 17px;
            color: #0b2b4a;
        }

        .screenshot-export .export-worker-total {
            background: #d7e5f5;
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            color: #0b2b4a;
        }

        .screenshot-export .export-worker-total .total-label {
            font-weight: 400;
            font-size: 12px;
            color: #4d6a8f;
            margin-right: 4px;
        }

        .screenshot-export .export-detail-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .screenshot-export .export-detail-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0;
            background: #f8faff;
            padding: 4px 14px 4px 16px;
            border-radius: 30px;
            border: 1px solid #e9edf4;
            flex-wrap: nowrap;
            font-size: 14px;
        }

        .screenshot-export .export-detail-item .field-group {
            display: flex;
            align-items: center;
            gap: 2px 6px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }

        .screenshot-export .export-detail-item .field-group.product-group {
            min-width: 100px;
        }

        .screenshot-export .export-detail-item .field-group.price-group {
            min-width: 90px;
        }

        .screenshot-export .export-detail-item .field-group.qty-group {
            min-width: 80px;
        }

        .screenshot-export .export-detail-item .field-label {
            color: #5a7a9e;
            font-size: 12px;
            font-weight: 400;
            min-width: 24px;
        }

        .screenshot-export .export-detail-item .field-value {
            font-weight: 500;
            color: #0b2b4a;
            font-size: 14px;
        }

        .screenshot-export .export-detail-item .field-value.price-val {
            color: #1f3a5e;
        }

        .screenshot-export .export-detail-item .field-value.qty-val {
            background: #eef3f9;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .screenshot-export .export-detail-item .amount-text {
            font-weight: 700;
            color: #1e7b4b;
            margin-left: auto;
            font-size: 15px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .screenshot-export .export-detail-item .divider {
            color: #c8d6e0;
            font-size: 16px;
            font-weight: 300;
            flex-shrink: 0;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            text-align: center;
        }

        .screenshot-export .export-summary-bar {
            background: #f2f6fe;
            border-radius: 12px;
            padding: 10px 20px;
            margin-top: 8px;
            border: 1px solid #e3eaf3;
            font-size: 18px;
            font-weight: 700;
            color: #0b2b4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .screenshot-export .export-summary-bar .summary-label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .screenshot-export .export-summary-bar .summary-label .icon {
            font-size: 20px;
        }

        .screenshot-export .export-summary-bar .value {
            background: #1f3a5e;
            color: white;
            padding: 4px 24px;
            border-radius: 40px;
            font-size: 19px;
            font-weight: 700;
        }

        .unit-small {
            font-size: 11px;
            color: #5a7a9e;
            margin-left: 1px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .app {
                padding: 16px 14px 20px;
                border-radius: 28px;
            }
            .app-header .brand .icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .app-header h1 {
                font-size: 18px;
            }
            .app-header h1 small {
                font-size: 12px;
                display: block;
                margin-left: 0;
            }
            .card {
                padding: 14px 14px 18px;
                border-radius: 20px;
            }
            .matrix-table input[type="number"] {
                width: 48px;
                font-size: 12px;
            }
            .matrix-table th,
            .matrix-table td {
                padding: 3px 2px;
                font-size: 12px;
            }
            .matrix-table td:first-child {
                font-size: 14px;
                padding-left: 8px;
            }
            .matrix-table th:first-child {
                padding-left: 8px;
            }
            .bottom-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .bottom-toolbar .actions {
                justify-content: center;
            }
            .screenshot-row {
                justify-content: center;
            }
            .summary-bar {
                font-size: 14px;
                padding: 8px 14px;
                flex-wrap: wrap;
                gap: 4px;
            }
            .summary-bar .total-value {
                font-size: 15px;
                padding: 2px 14px;
            }
            .stats-container {
                max-width: 100%;
            }
            .summary-bar {
                max-width: 100%;
            }
            .chip .chip-input {
                font-size: 12px;
                min-width: 28px;
            }
            .header-stats .stat-badge {
                font-size: 11px;
                padding: 4px 12px;
            }
            .matrix-table .worker-label {
                font-size: 14px;
            }
            .worker-detail .item {
                flex-wrap: wrap;
                gap: 2px 4px;
                padding: 4px 10px;
            }
            .worker-detail .item .amount {
                margin-left: 0;
            }
            .worker-detail .item .divider {
                width: 14px;
                font-size: 13px;
            }
            .worker-detail .item .field-group.product-group,
            .worker-detail .item .field-group.price-group,
            .worker-detail .item .field-group.qty-group {
                min-width: auto;
            }
            .screenshot-export .export-detail-item {
                flex-wrap: wrap;
                gap: 2px 4px;
            }
            .screenshot-export .export-detail-item .amount-text {
                margin-left: 0;
            }
            .screenshot-export .export-detail-item .divider {
                width: 14px;
                font-size: 13px;
            }
            .screenshot-export .export-detail-item .field-group.product-group,
            .screenshot-export .export-detail-item .field-group.price-group,
            .screenshot-export .export-detail-item .field-group.qty-group {
                min-width: auto;
            }
            .screenshot-export {
                padding: 16px;
                max-width: 100%;
            }
            .screenshot-export .report-title {
                font-size: 18px;
            }
            .screenshot-export .export-summary-bar {
                font-size: 15px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .screenshot-export .export-summary-bar .value {
                font-size: 16px;
                padding: 2px 16px;
            }
            .stats-container {
                max-width: 100%;
            }
        }

        @media print {
            .btn,
            .screenshot-row .btn,
            .bottom-toolbar .actions .btn {
                display: none !important;
            }
            .app {
                box-shadow: none;
                border: 1px solid #ddd;
                backdrop-filter: none;
                background: white;
            }
            .card {
                box-shadow: none;
                border: 1px solid #eee;
            }
            body {
                background: white;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- ===== 头部 ===== -->
        <header class="app-header">
            <div class="brand">
                <div class="icon">📊</div>
                <h1>工资统计 <small>· 一键截图</small></h1>
            </div>
            <div class="header-stats">
                <span class="stat-badge" id="totalWorkerBadge">👤 0 人</span>
                <span class="stat-badge" id="totalProductBadge">🏷️ 0 个</span>
            </div>
        </header>

        <!-- ===== 两列布局 ===== -->
        <div class="layout-grid">
            <!-- 左：人员管理 -->
            <div class="card">
                <div class="card-title">👤 人员管理 <span class="badge" id="workerCount">0 人</span></div>
                <div class="flex-row">
                    <div class="input-group">
                        <label>姓名</label>
                        <input type="text" id="workerNameInput" placeholder="请输入姓名">
                    </div>
                    <button class="btn btn-primary" id="addWorkerBtn">添加</button>
                    <button class="btn btn-outline btn-sm" id="resetWorkersBtn">重置</button>
                </div>
                <div class="chip-group" id="workerChips"></div>
            </div>

            <!-- 右：货号管理 -->
            <div class="card">
                <div class="card-title">🏷️ 货号管理 <span class="badge" id="productCount">0 个</span></div>
                <div class="flex-row">
                    <div class="input-group">
                        <label>货号</label>
                        <input type="text" id="productNameInput" placeholder="请输入货号">
                    </div>
                    <div class="input-group">
                        <label>单价 (元)</label>
                        <input type="number" id="productPriceInput" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <button class="btn btn-primary" id="addProductBtn">添加</button>
                    <button class="btn btn-outline btn-sm" id="resetProductsBtn">重置</button>
                </div>
                <div class="chip-group" id="productChips"></div>
            </div>
        </div>

        <!-- ===== 录入矩阵 ===== -->
        <div class="card" style="margin-bottom: 0; border-radius: 28px;">
            <div class="card-title" style="margin-bottom: 10px;">
                📊 录入数量
                <span class="hint" id="activeWorkerHint" style="font-weight:400;font-size:12px;color:#5a7a9e;background:#eef3f9;padding:2px 14px;border-radius:30px;">点击姓名 → 回车确认</span>
            </div>
            <div class="matrix-wrapper" id="matrixWrapper">
                <table class="matrix-table" id="matrixTable">
                    <thead id="matrixHead"><tr><th>👤 姓名 \ 🏷️ 货号</th></tr></thead>
                    <tbody id="matrixBody"><tr><td colspan="2" class="empty-message">请先添加人员和货号</td></tr></tbody>
                    <tfoot id="matrixFoot"></tfoot>
                </table>
            </div>
        </div>

        <!-- ===== 底部：工资明细 + 操作 ===== -->
        <div class="bottom-section">
            <div class="bottom-toolbar">
                <div class="left">
                    <span class="label">🧾 工资明细</span>
                    <span class="hint">截图区域</span>
                </div>
                <div class="actions">
                    <button class="btn btn-success btn-sm" id="exportTemplateBtn">📤 导出模板</button>
                    <div class="file-upload-wrapper">
                        <button class="btn btn-warning btn-sm" id="uploadBtn">📥 上传表格</button>
                        <input type="file" id="fileInput" accept=".csv,.tsv,.txt">
                    </div>
                    <button class="btn btn-danger btn-sm" id="clearQuantitiesBtn">🗑️ 清空数量</button>
                </div>
            </div>

            <div class="screenshot-row">
                <button class="btn btn-screenshot" id="screenshotBtn">📸 一键截图打包</button>
            </div>

            <div class="stats-wrapper" id="statsWrapper">
                <div class="stats-container" id="statsContainer"></div>
                <div class="summary-bar" id="screenshotSummary">
                    <span>💰 所有人总工资</span>
                    <span class="total-value" id="grandTotalDisplay">0.00 元</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js">
    </script>
    <script>
        (function() {
            // ---------- 数据 ----------
            let workers = [];
            let products = [];
            let quantities = {};

            // DOM
            const workerChips = document.getElementById('workerChips');
            const productChips = document.getElementById('productChips');
            const workerCount = document.getElementById('workerCount');
            const productCount = document.getElementById('productCount');
            const totalWorkerBadge = document.getElementById('totalWorkerBadge');
            const totalProductBadge = document.getElementById('totalProductBadge');
            const matrixHead = document.getElementById('matrixHead');
            const matrixBody = document.getElementById('matrixBody');
            const matrixFoot = document.getElementById('matrixFoot');
            const statsContainer = document.getElementById('statsContainer');
            const statsWrapper = document.getElementById('statsWrapper');
            const grandTotalDisplay = document.getElementById('grandTotalDisplay');
            const activeWorkerHint = document.getElementById('activeWorkerHint');

            const workerInput = document.getElementById('workerNameInput');
            const productInput = document.getElementById('productNameInput');
            const priceInput = document.getElementById('productPriceInput');
            const addWorkerBtn = document.getElementById('addWorkerBtn');
            const addProductBtn = document.getElementById('addProductBtn');
            const resetWorkersBtn = document.getElementById('resetWorkersBtn');
            const resetProductsBtn = document.getElementById('resetProductsBtn');
            const clearQuantitiesBtn = document.getElementById('clearQuantitiesBtn');
            const screenshotBtn = document.getElementById('screenshotBtn');
            const exportTemplateBtn = document.getElementById('exportTemplateBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');

            // ---------- 辅助 ----------
            function formatMoney(v) { return Number(v).toFixed(2); }

            function getProductPrice(productId) {
                const p = products.find(item => item.id === productId);
                return p ? p.price : 0;
            }

            function calcWorkerTotal(worker) {
                const qMap = quantities[worker] || {};
                let total = 0;
                for (const p of products) {
                    const q = qMap[p.id] || 0;
                    total += q * p.price;
                }
                return total;
            }

            function calcGrandTotal() {
                let sum = 0;
                for (const w of workers) sum += calcWorkerTotal(w);
                return sum;
            }

            function getQuantity(worker, productId) {
                return (quantities[worker] && quantities[worker][productId]) ?? '';
            }

            function setQuantity(worker, productId, val) {
                if (!quantities[worker]) quantities[worker] = {};
                const num = parseInt(val, 10);
                if (val === '' || isNaN(num) || num < 0) {
                    quantities[worker][productId] = 0;
                } else {
                    quantities[worker][productId] = num;
                }
                renderMatrix();
                renderStats();
                updateGrandTotal();
            }

            function calcProductTotals() {
                const totals = {};
                for (const p of products) {
                    totals[p.id] = 0;
                }
                for (const w of workers) {
                    const qMap = quantities[w] || {};
                    for (const p of products) {
                        totals[p.id] += (qMap[p.id] || 0);
                    }
                }
                return totals;
            }

            // ---------- 选中状态 ----------
            let selectedWorkers = new Set();

            function isWorkerSelected(worker) { return selectedWorkers.has(worker); }

            function toggleWorkerSelection(worker) {
                if (selectedWorkers.has(worker)) {
                    selectedWorkers.delete(worker);
                } else {
                    selectedWorkers.add(worker);
                }
                renderMatrix();
            }

            // ---------- 渲染 ----------
            function renderWorkers() {
                if (workers.length === 0) {
                    workerChips.innerHTML = `<span style="color: #8fa2bb; font-size: 13px;">暂无人员</span>`;
                    workerCount.textContent = '0 人';
                    totalWorkerBadge.textContent = '👤 0 人';
                    return;
                }
                let html = '';
                for (const w of workers) {
                    html += `<span class="chip">
                        <input class="chip-input worker-input" type="text" value="${escapeHtml(w)}" data-worker="${escapeHtml(w)}" placeholder="姓名">
                        <span class="remove" data-worker="${escapeHtml(w)}">✕</span>
                    </span>`;
                }
                workerChips.innerHTML = html;
                workerCount.textContent = workers.length + ' 人';
                totalWorkerBadge.textContent = '👤 ' + workers.length + ' 人';

                workerChips.querySelectorAll('.chip-input.worker-input').forEach(inp => {
                    inp.addEventListener('blur', function() {
                        const oldName = this.dataset.worker;
                        const newName = this.value.trim();
                        if (!newName) { this.value = oldName; return; }
                        if (newName === oldName) return;
                        if (workers.includes(newName)) {
                            alert('姓名 "' + newName + '" 已存在');
                            this.value = oldName;
                            return;
                        }
                        const idx = workers.indexOf(oldName);
                        if (idx !== -1) {
                            workers[idx] = newName;
                            if (quantities[oldName]) {
                                quantities[newName] = quantities[oldName];
                                delete quantities[oldName];
                            }
                            if (selectedWorkers.has(oldName)) {
                                selectedWorkers.delete(oldName);
                                selectedWorkers.add(newName);
                            }
                            this.dataset.worker = newName;
                            fullRender();
                            setTimeout(() => {
                                const newInput = workerChips.querySelector(
                                    `.chip-input.worker-input[data-worker="${escapeHtml(newName)}"]`);
                                if (newInput) newInput.focus();
                            }, 50);
                        }
                    });
                    inp.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') { e.preventDefault();
                            this.blur(); }
                    });
                });

                workerChips.querySelectorAll('.remove').forEach(el => {
                    el.addEventListener('click', function() {
                        const name = this.dataset.worker;
                        removeWorker(name);
                    });
                });
            }

            function renderProducts() {
                if (products.length === 0) {
                    productChips.innerHTML = `<span style="color: #8fa2bb; font-size: 13px;">暂无货号</span>`;
                    productCount.textContent = '0 个';
                    totalProductBadge.textContent = '🏷️ 0 个';
                    return;
                }
                let html = '';
                for (const p of products) {
                    html += `<span class="chip">
                        <input class="chip-input product-input" type="text" value="${escapeHtml(p.id)}" data-product="${escapeHtml(p.id)}" placeholder="货号">
                        <input class="chip-input price-input" type="number" step="0.01" min="0" value="${p.price}" data-product="${escapeHtml(p.id)}" placeholder="单价">
                        <span class="remove" data-product="${escapeHtml(p.id)}">✕</span>
                    </span>`;
                }
                productChips.innerHTML = html;
                productCount.textContent = products.length + ' 个';
                totalProductBadge.textContent = '🏷️ ' + products.length + ' 个';

                productChips.querySelectorAll('.chip-input.product-input').forEach(inp => {
                    inp.addEventListener('blur', function() {
                        const oldId = this.dataset.product;
                        const newId = this.value.trim();
                        if (!newId) { this.value = oldId; return; }
                        if (newId === oldId) return;
                        if (products.some(p => p.id === newId)) {
                            alert('货号 "' + newId + '" 已存在');
                            this.value = oldId;
                            return;
                        }
                        const pIdx = products.findIndex(p => p.id === oldId);
                        if (pIdx !== -1) {
                            const price = products[pIdx].price;
                            products[pIdx] = { id: newId, price: price };
                            for (const w of workers) {
                                if (quantities[w] && quantities[w][oldId] !== undefined) {
                                    quantities[w][newId] = quantities[w][oldId];
                                    delete quantities[w][oldId];
                                }
                            }
                            this.dataset.product = newId;
                            const priceInp = productChips.querySelector(
                                `.chip-input.price-input[data-product="${escapeHtml(oldId)}"]`);
                            if (priceInp) priceInp.dataset.product = newId;
                            fullRender();
                            setTimeout(() => {
                                const newInput = productChips.querySelector(
                                    `.chip-input.product-input[data-product="${escapeHtml(newId)}"]`);
                                if (newInput) newInput.focus();
                            }, 50);
                        }
                    });
                    inp.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') { e.preventDefault();
                            this.blur(); }
                    });
                });

                productChips.querySelectorAll('.chip-input.price-input').forEach(inp => {
                    inp.addEventListener('blur', function() {
                        const productId = this.dataset.product;
                        const val = parseFloat(this.value);
                        if (isNaN(val) || val < 0) {
                            const p = products.find(item => item.id === productId);
                            if (p) this.value = p.price;
                            return;
                        }
                        const p = products.find(item => item.id === productId);
                        if (p) { p.price = val;
                            fullRender(); }
                    });
                    inp.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') { e.preventDefault();
                            this.blur(); }
                    });
                });

                productChips.querySelectorAll('.remove').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.product;
                        removeProduct(id);
                    });
                });
            }

            function renderMatrix() {
                if (workers.length === 0 || products.length === 0) {
                    matrixHead.innerHTML = `<tr><th>👤 姓名 \ 🏷️ 货号</th></tr>`;
                    matrixBody.innerHTML =
                        `<tr><td colspan="${products.length + 2}" class="empty-message">请先添加人员和货号</td></tr>`;
                    matrixFoot.innerHTML = '';
                    activeWorkerHint.textContent = '请先添加人员和货号';
                    return;
                }

                let headHtml = `<tr><th style="min-width:80px;text-align:center;">👤 姓名 \ 🏷️ 货号</th>`;
                for (const p of products) {
                    headHtml +=
                        `<th>${escapeHtml(p.id)}<br><span style="font-weight:400;font-size:10px;color:#5a7a9e;">${formatMoney(p.price)}元</span></th>`;
                }
                headHtml += `<th style="min-width:60px;">合计</th></tr>`;
                matrixHead.innerHTML = headHtml;

                let bodyHtml = '';
                let anyChecked = false;
                for (const w of workers) {
                    const checked = isWorkerSelected(w);
                    if (checked) anyChecked = true;
                    const total = calcWorkerTotal(w);
                    bodyHtml += `<tr>`;
                    bodyHtml +=
                        `<td style="text-align:center;background:#fafcff;cursor:pointer;font-weight:700;font-size:16px;" class="worker-name-cell" data-worker="${escapeHtml(w)}">
                        <span class="worker-label">${escapeHtml(w)}</span>
                    </td>`;
                    for (const p of products) {
                        const q = getQuantity(w, p.id);
                        const disabled = !checked ? 'disabled' : '';
                        bodyHtml += `<td>
                            <input type="number" min="0" step="1" value="${q === '' ? '' : q}" 
                                   data-worker="${escapeHtml(w)}" data-product="${escapeHtml(p.id)}" 
                                   ${disabled} class="qty-input" placeholder="">
                            <span class="unit-suffix">件</span>
                        </td>`;
                    }
                    bodyHtml += `<td><span class="total-col">${formatMoney(total)}<span class="unit-suffix">元</span></span></td>`;
                    bodyHtml += `</tr>`;
                }
                matrixBody.innerHTML = bodyHtml;
                activeWorkerHint.textContent = anyChecked ? '✅ 输入数字后按回车确认' : '⚠️ 点击姓名行激活';

                matrixBody.querySelectorAll('.worker-name-cell').forEach(td => {
                    td.addEventListener('click', function() {
                        const worker = this.dataset.worker;
                        toggleWorkerSelection(worker);
                    });
                });

                matrixBody.querySelectorAll('.qty-input').forEach(inp => {
                    inp.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') { e.preventDefault();
                            this.blur(); }
                    });
                    inp.addEventListener('blur', function() {
                        const worker = this.dataset.worker;
                        const product = this.dataset.product;
                        const val = this.value;
                        setQuantity(worker, product, val);
                        const current = getQuantity(worker, product);
                        this.value = current === '' ? '' : current;
                    });
                });

                renderSummaryRow();
            }

            function renderSummaryRow() {
                if (workers.length === 0 || products.length === 0) {
                    matrixFoot.innerHTML = '';
                    return;
                }
                const totals = calcProductTotals();
                let footHtml = `<tr class="summary-row"><td>📊 数量汇总</td>`;
                let grandTotal = 0;
                for (const p of products) {
                    const qty = totals[p.id] || 0;
                    footHtml += `<td><strong>${qty}</strong><span class="unit-suffix">件</span></td>`;
                    grandTotal += qty;
                }
                footHtml += `<td><strong>${grandTotal}</strong><span class="unit-suffix">件</span></td></tr>`;
                matrixFoot.innerHTML = footHtml;
            }

            function renderStats() {
                if (workers.length === 0) {
                    statsContainer.innerHTML = `<div style="padding:18px;text-align:center;color:#8fa2bb;">暂无数据</div>`;
                    return;
                }
                let html = '';
                for (const w of workers) {
                    const total = calcWorkerTotal(w);
                    const entries = products.map(p => ({ product: p.id, quantity: getQuantity(w, p.id), price: p.price }));
                    const hasData = entries.some(e => e.quantity > 0);
                    if (!hasData) {
                        html += `<div class="worker-card" data-worker="${escapeHtml(w)}">
                            <div class="worker-card-header">
                                <span class="worker-name">${escapeHtml(w)}</span>
                                <span class="total"><span class="label">总工资</span> ${formatMoney(total)}<span class="unit-suffix">元</span></span>
                            </div>
                            <div style="color:#8fa2bb; font-size:14px; padding:4px 0;">暂无产量数据</div>
                        </div>`;
                        continue;
                    }
                    html += `<div class="worker-card" data-worker="${escapeHtml(w)}">
                        <div class="worker-card-header">
                            <span class="worker-name">${escapeHtml(w)}</span>
                            <span class="total"><span class="label">总工资</span> ${formatMoney(total)}<span class="unit-suffix">元</span></span>
                        </div>
                        <div class="worker-detail">`;
                    for (const e of entries) {
                        if (e.quantity === 0) continue;
                        const amount = e.quantity * e.price;
                        html += `<div class="item">
                            <div class="field-group product-group">
                                <span class="field-label">货号</span>
                                <span class="field-value">${escapeHtml(e.product)}</span>
                            </div>
                            <span class="divider">│</span>
                            <div class="field-group price-group">
                                <span class="field-label">单价</span>
                                <span class="field-value price-val">${formatMoney(e.price)}<span class="unit-suffix">元</span></span>
                            </div>
                            <span class="divider">│</span>
                            <div class="field-group qty-group">
                                <span class="field-label">数量</span>
                                <span class="field-value qty-val">${e.quantity}<span class="unit-suffix">件</span></span>
                            </div>
                            <span class="amount">${formatMoney(amount)}<span class="unit-suffix">元</span></span>
                        </div>`;
                    }
                    html += `</div></div>`;
                }
                statsContainer.innerHTML = html;
            }

            function updateGrandTotal() {
                const total = calcGrandTotal();
                grandTotalDisplay.textContent = formatMoney(total) + ' 元';
            }

            function fullRender() {
                renderWorkers();
                renderProducts();
                renderMatrix();
                renderStats();
                updateGrandTotal();
            }

            // ---------- 导出模板（含单价列） ----------
            function exportTemplate() {
                if (workers.length === 0 || products.length === 0) {
                    alert('请先添加人员和货号');
                    return;
                }
                let header = '姓名';
                for (const p of products) {
                    header += ',' + p.id + '(数量)';
                }
                let priceRow = '单价';
                for (const p of products) {
                    priceRow += ',' + formatMoney(p.price);
                }
                let rows = [header, priceRow];
                for (const w of workers) {
                    let row = w;
                    for (const p of products) {
                        row += ',';
                    }
                    rows.push(row);
                }
                const csv = rows.join('\n');
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.download = '工资模板(含单价).csv';
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
            }

            // ---------- 上传表格（支持导入单价） ----------
            function handleFileUpload(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                    if (lines.length < 3) {
                        alert('文件格式错误：至少需要标题行、单价行和一行数据');
                        return;
                    }
                    const headerLine = lines[0];
                    const headers = headerLine.split(',').map(s => s.trim());
                    if (headers[0] !== '姓名') {
                        alert('第一列标题必须是 "姓名"');
                        return;
                    }
                    const priceLine = lines[1];
                    const priceParts = priceLine.split(',').map(s => s.trim());
                    if (priceParts[0] !== '单价') {
                        alert('第二行必须是 "单价" 行');
                        return;
                    }
                    const productIds = [];
                    const priceMap = {};
                    for (let i = 1; i < headers.length && i < priceParts.length; i++) {
                        const h = headers[i];
                        const match = h.match(/^([^(]+)/);
                        const pid = match ? match[1].trim() : h;
                        productIds.push(pid);
                        const priceVal = parseFloat(priceParts[i]);
                        if (!isNaN(priceVal) && priceVal >= 0) {
                            priceMap[pid] = priceVal;
                        } else {
                            priceMap[pid] = 0;
                        }
                    }
                    if (productIds.length === 0) {
                        alert('未找到货号列');
                        return;
                    }

                    for (const pid of productIds) {
                        const existing = products.find(p => p.id === pid);
                        if (existing) {
                            existing.price = priceMap[pid] || 0;
                        } else {
                            products.push({ id: pid, price: priceMap[pid] || 0 });
                        }
                    }

                    const dataLines = lines.slice(2);
                    let newQuantities = {};
                    let newWorkers = [];
                    for (const line of dataLines) {
                        const parts = line.split(',').map(s => s.trim());
                        if (parts.length < 1) continue;
                        const name = parts[0];
                        if (!name) continue;
                        if (!newWorkers.includes(name)) newWorkers.push(name);
                        newQuantities[name] = {};
                        for (let i = 1; i < parts.length && i < headers.length; i++) {
                            const pid = productIds[i - 1];
                            const val = parseInt(parts[i], 10);
                            if (!isNaN(val) && val > 0) {
                                newQuantities[name][pid] = val;
                            } else {
                                newQuantities[name][pid] = 0;
                            }
                        }
                    }

                    if (newWorkers.length === 0) {
                        alert('未解析到有效数据');
                        return;
                    }

                    for (const w of newWorkers) {
                        if (!workers.includes(w)) {
                            workers.push(w);
                        }
                    }
                    for (const w of newWorkers) {
                        if (!quantities[w]) quantities[w] = {};
                        for (const pid of productIds) {
                            if (newQuantities[w] && newQuantities[w][pid] !== undefined) {
                                quantities[w][pid] = newQuantities[w][pid];
                            }
                        }
                    }

                    for (const w of workers) selectedWorkers.add(w);

                    fullRender();
                    alert('数据导入成功！共导入 ' + newWorkers.length + ' 位人员，更新了 ' + productIds.length + ' 个货号的单价');
                };
                reader.readAsText(file, 'UTF-8');
            }

            // ---------- 构建截图HTML - 高清清晰 ----------
            function buildScreenshotHTML() {
                if (workers.length === 0 || products.length === 0) return null;

                let html = `
                    <div class="screenshot-export">
                        <div class="report-title">📊 工资统计报表</div>
                        <div class="report-date">生成日期：${new Date().toLocaleString()}</div>
                        
                        <table class="export-table">
                            <thead>
                                <tr>
                                    <th>👤 姓名</th>
                    `;
                for (const p of products) {
                    html += `<th>${escapeHtml(p.id)}<br><span style="font-weight:400;font-size:10px;color:#5a7a9e;">${formatMoney(p.price)}<span class="unit-small">元</span></span></th>`;
                }
                html += `<th>合计</th></tr></thead><tbody>`;

                for (const w of workers) {
                    const total = calcWorkerTotal(w);
                    html += `<tr><td style="font-weight:600;">${escapeHtml(w)}</td>`;
                    for (const p of products) {
                        const q = getQuantity(w, p.id) || 0;
                        html += `<td>${q}<span class="unit-small">件</span></td>`;
                    }
                    html += `<td style="font-weight:600;">${formatMoney(total)}<span class="unit-small">元</span></td></tr>`;
                }

                const totals = calcProductTotals();
                let grandQty = 0;
                html += `<tr class="total-row"><td>📊 汇总</td>`;
                for (const p of products) {
                    const qty = totals[p.id] || 0;
                    html += `<td>${qty}<span class="unit-small">件</span></td>`;
                    grandQty += qty;
                }
                html += `<td>${grandQty}<span class="unit-small">件</span></td></tr>`;
                html += `</tbody></table>`;

                html += `<div class="export-section-title">🧾 工资明细</div>`;
                for (const w of workers) {
                    const total = calcWorkerTotal(w);
                    const entries = products.map(p => ({ product: p.id, quantity: getQuantity(w, p.id), price: p.price }));
                    const hasData = entries.some(e => e.quantity > 0);

                    html += `<div class="export-worker-card">
                        <div class="export-worker-header">
                            <span class="export-worker-name">${escapeHtml(w)}</span>
                            <span class="export-worker-total"><span class="total-label">总工资</span> ${formatMoney(total)}<span class="unit-small">元</span></span>
                        </div>`;

                    if (!hasData) {
                        html += `<div style="color:#8fa2bb;font-size:14px;padding:6px 0;">暂无产量数据</div>`;
                    } else {
                        html += `<div class="export-detail-list">`;
                        for (const e of entries) {
                            if (e.quantity === 0) continue;
                            const amount = e.quantity * e.price;
                            html += `<div class="export-detail-item">
                                <div class="field-group product-group">
                                    <span class="field-label">货号</span>
                                    <span class="field-value">${escapeHtml(e.product)}</span>
                                </div>
                                <span class="divider">│</span>
                                <div class="field-group price-group">
                                    <span class="field-label">单价</span>
                                    <span class="field-value price-val">${formatMoney(e.price)}<span class="unit-small">元</span></span>
                                </div>
                                <span class="divider">│</span>
                                <div class="field-group qty-group">
                                    <span class="field-label">数量</span>
                                    <span class="field-value qty-val">${e.quantity}<span class="unit-small">件</span></span>
                                </div>
                                <span class="amount-text">${formatMoney(amount)}<span class="unit-small">元</span></span>
                            </div>`;
                        }
                        html += `</div>`;
                    }
                    html += `</div>`;
                }

                const grandTotal = calcGrandTotal();
                html += `
                        <div class="export-summary-bar">
                            <span class="summary-label">
                                <span class="icon">💰</span>
                                <span>所有人总工资</span>
                            </span>
                            <span class="value">${formatMoney(grandTotal)} 元</span>
                        </div>
                    </div>
                `;

                return html;
            }

            // ---------- 截图 - 高清 ----------
            async function captureAll() {
                if (workers.length === 0 || products.length === 0) {
                    alert('请先添加人员和货号');
                    return;
                }

                if (typeof html2canvas === 'undefined' || typeof JSZip === 'undefined') {
                    alert('截图库加载中，请稍后重试');
                    return;
                }

                const htmlContent = buildScreenshotHTML();
                if (!htmlContent) {
                    alert('暂无数据可截图');
                    return;
                }

                const tempContainer = document.createElement('div');
                tempContainer.style.cssText =
                    'position:absolute;left:-9999px;top:0;width:620px;background:white;padding:20px 24px;border-radius:16px;';
                tempContainer.innerHTML = htmlContent;
                document.body.appendChild(tempContainer);

                const zip = new JSZip();
                const timestamp = new Date().toISOString().slice(0, 10);

                try {
                    await new Promise(resolve => setTimeout(resolve, 150));

                    // 高清截图 - 使用 scale: 4 提高清晰度
                    const canvas = await html2canvas(tempContainer, {
                        scale: 4,
                        backgroundColor: '#ffffff',
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                        width: tempContainer.scrollWidth,
                        height: tempContainer.scrollHeight,
                        onclone: function(clonedDoc, element) {
                            // 确保所有字体正确渲染
                            const style = clonedDoc.createElement('style');
                            style.textContent =
                                '* { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; }';
                            clonedDoc.head.appendChild(style);
                        }
                    });
                    const dataUrl = canvas.toDataURL('image/png');
                    const base64 = dataUrl.split(',')[1];
                    zip.file(`工资报表_${timestamp}.png`, base64, { base64: true });

                    // 为每个人单独截图 - 高清
                    const cards = tempContainer.querySelectorAll('.export-worker-card');
                    for (let i = 0; i < cards.length; i++) {
                        const card = cards[i];
                        const nameEl = card.querySelector('.export-worker-name');
                        const workerName = nameEl ? nameEl.textContent.trim() : `人员${i+1}`;
                        try {
                            const cardCanvas = await html2canvas(card, {
                                scale: 4,
                                backgroundColor: '#ffffff',
                                allowTaint: false,
                                useCORS: true,
                                logging: false,
                                width: card.scrollWidth,
                                height: card.scrollHeight,
                            });
                            const cardDataUrl = cardCanvas.toDataURL('image/png');
                            const cardBase64 = cardDataUrl.split(',')[1];
                            zip.file(`${workerName}_工资条.png`, cardBase64, { base64: true });
                        } catch (e) {
                            console.warn(`截图 ${workerName} 失败:`, e);
                        }
                    }

                    const content = await zip.generateAsync({ type: 'blob' });
                    const link = document.createElement('a');
                    link.download = `工资截图_${timestamp}.zip`;
                    link.href = URL.createObjectURL(content);
                    link.click();
                    URL.revokeObjectURL(link.href);
                } catch (e) {
                    console.error('截图失败:', e);
                    alert('截图生成失败，请重试');
                } finally {
                    document.body.removeChild(tempContainer);
                }
            }

            // ---------- 数据操作 ----------
            function addWorker(name) {
                const t = name.trim();
                if (!t) { alert('请输入姓名'); return false; }
                if (workers.includes(t)) { alert('姓名已存在'); return false; }
                workers.push(t);
                selectedWorkers.add(t);
                fullRender();
                workerInput.value = '';
                workerInput.focus();
                return true;
            }

            function removeWorker(name) {
                if (!workers.includes(name)) return;
                if (!confirm(`确定移除 “${name}” 吗？`)) return;
                workers = workers.filter(w => w !== name);
                selectedWorkers.delete(name);
                delete quantities[name];
                fullRender();
            }

            function addProduct(id, price) {
                const tid = id.trim();
                if (!tid) { alert('请输入货号'); return false; }
                if (products.some(p => p.id === tid)) { alert('货号已存在'); return false; }
                const p = parseFloat(price);
                if (isNaN(p) || p < 0) { alert('请输入有效的单价 (≥ 0)'); return false; }
                products.push({ id: tid, price: p });
                fullRender();
                productInput.value = '';
                priceInput.value = '';
                productInput.focus();
                return true;
            }

            function removeProduct(id) {
                if (!products.some(p => p.id === id)) return;
                if (!confirm(`确定移除货号 “${id}” 吗？`)) return;
                products = products.filter(p => p.id !== id);
                for (const w of workers)
                    if (quantities[w]) delete quantities[w][id];
                fullRender();
            }

            function clearQuantities() {
                if (workers.length === 0 && products.length === 0) return;
                if (!confirm('确定要清空所有已录入的数量数据吗？（人员和货号配置将保留）')) return;
                quantities = {};
                selectedWorkers = new Set();
                fullRender();
            }

            function loadEmptyData() {
                workers = [];
                products = [];
                quantities = {};
                selectedWorkers = new Set();
                fullRender();
            }

            function resetWorkersDefault() {
                if (workers.length > 0 && !confirm('重置将清空当前数据，确定？')) return;
                workers = [];
                quantities = {};
                selectedWorkers = new Set();
                fullRender();
            }

            function resetProductsDefault() {
                if (products.length > 0 && !confirm('重置将清空当前数据，确定？')) return;
                products = [];
                quantities = {};
                fullRender();
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            // ---------- 事件绑定 ----------
            addWorkerBtn.addEventListener('click', () => addWorker(workerInput.value));
            workerInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                    addWorkerBtn.click(); } });

            addProductBtn.addEventListener('click', () => addProduct(productInput.value, priceInput.value));
            productInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                    addProductBtn.click(); } });
            priceInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                    addProductBtn.click(); } });

            resetWorkersBtn.addEventListener('click', resetWorkersDefault);
            resetProductsBtn.addEventListener('click', resetProductsDefault);
            clearQuantitiesBtn.addEventListener('click', clearQuantities);
            screenshotBtn.addEventListener('click', captureAll);
            exportTemplateBtn.addEventListener('click', exportTemplate);

            uploadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    handleFileUpload(this.files[0]);
                    this.value = '';
                }
            });

            loadEmptyData();
        })();
    </script>
</body>
</html>
