<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>健身倒计时 · 组间提醒 + 暂停</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #0b1a2e 0%, #1b2f44 100%);
            padding: 16px;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 32px 28px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #e8f0fe;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 28px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.6);
            word-break: break-word;
        }
        .timer-display {
            background: #0e1d2b;
            border-radius: 80px;
            padding: 28px 16px;
            margin-bottom: 28px;
            box-shadow: inset 0 10px 14px rgba(0,0,0,0.6), 0 6px 12px rgba(0,0,0,0.3);
            border: 1px solid #2d4b62;
        }
        .time-text {
            font-size: 5.6rem;
            font-weight: 700;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 6px;
            color: #b3e4ff;
            text-shadow: 0 0 20px #3f9eff55;
            line-height: 1.2;
        }
        .group-badge {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 500;
            color: #b6d0e0;
            background: #1b3347;
            display: inline-block;
            padding: 6px 26px;
            border-radius: 60px;
            margin: 0 auto 6px;
            letter-spacing: 1px;
            border: 1px solid #3b5e79;
            backdrop-filter: blur(4px);
        }
        .badge-wrap {
            display: flex;
            justify-content: center;
        }
        .settings {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 40px;
            padding: 22px 18px;
            margin-bottom: 28px;
            border: 1px solid #2a465b;
        }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .setting-row:last-child {
            margin-bottom: 0;
        }
        .setting-label {
            font-size: 1.1rem;
            font-weight: 500;
            color: #d4e3f0;
            min-width: 80px;
        }
        .setting-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
        }
        .setting-control input {
            width: 85px;
            padding: 12px 10px;
            border-radius: 40px;
            border: none;
            background: #132433;
            color: #e3f0fa;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.5);
            transition: 0.15s;
            border: 1px solid #2f4d66;
        }
        .setting-control input:focus {
            outline: 2px solid #5b9bd5;
            background: #0e1f31;
            border-color: #6db0f0;
        }
        .setting-control input[type="number"] {
            -moz-appearance: textfield;
        }
        .setting-control input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }
        .btn {
            background: #264a62;
            border: none;
            border-radius: 60px;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #f0f9ff;
            flex: 1 1 100px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0b1a26, 0 6px 12px rgba(0,0,0,0.4);
            transition: all 0.08s linear;
            text-align: center;
            letter-spacing: 0.5px;
            border: 1px solid #3f6a87;
            background: #1e405a;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #0b1a26, 0 8px 14px rgba(0,0,0,0.5);
        }
        .btn-primary {
            background: #2f7db0;
            border-color: #56a1d4;
            box-shadow: 0 6px 0 #17405c, 0 6px 12px rgba(0,0,0,0.4);
            color: white;
        }
        .btn-warning {
            background: #b48b2c;
            border-color: #dbb13a;
            box-shadow: 0 6px 0 #6f551b, 0 6px 12px rgba(0,0,0,0.4);
            color: #fff9e6;
        }
        .btn-danger {
            background: #b1423a;
            border-color: #d95c52;
            box-shadow: 0 6px 0 #6d2822, 0 6px 12px rgba(0,0,0,0.4);
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #0b1a26;
            pointer-events: none;
        }
        .status-text {
            font-size: 1rem;
            color: #b0ccdf;
            text-align: center;
            margin-top: 20px;
            background: #11243380;
            padding: 8px 12px;
            border-radius: 60px;
            border: 1px solid #2b4b61;
            backdrop-filter: blur(4px);
        }
        .info-note {
            font-size: 0.9rem;
            color: #a0bccf;
            text-align: center;
            margin-top: 14px;
            opacity: 0.8;
        }
        @media (max-width: 450px) {
            .card { padding: 20px 14px; }
            .time-text { font-size: 4.2rem; }
            .setting-control input { width: 70px; }
            .btn { padding: 14px 12px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🏋️ 健身倒计时</h1>

        <div class="badge-wrap">
            <span class="group-badge" id="groupBadge">第 1 组</span>
        </div>

        <div class="timer-display">
            <div class="time-text" id="timerDisplay">00:00</div>
        </div>

        <div class="settings">
            <div class="setting-row">
                <span class="setting-label">⏱️ 每组秒数</span>
                <div class="setting-control">
                    <input type="number" id="groupDurationInput" value="30" min="3" max="999" step="1">
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label">🔢 总组数</span>
                <div class="setting-control">
                    <input type="number" id="totalGroupsInput" value="5" min="1" max="99" step="1">
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="startBtn">▶ 开始</button>
            <button class="btn btn-warning" id="pauseBtn" disabled>⏸️ 暂停</button>
            <button class="btn btn-danger" id="resetBtn">⏹ 重置</button>
        </div>

        <div class="status-text" id="statusMessage">就绪 · 点击开始</div>
        <div class="info-note">🔊 所有提示音音量 100% · 每组开始播报 · 结束前5秒每秒提示</div>
    </div>

    <script>
        (function() {
            // DOM 元素
            const timerDisplay = document.getElementById('timerDisplay');
            const groupBadge = document.getElementById('groupBadge');
            const statusMessage = document.getElementById('statusMessage');
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');
            const groupDurationInput = document.getElementById('groupDurationInput');
            const totalGroupsInput = document.getElementById('totalGroupsInput');

            // 核心状态
            let state = {
                isRunning: false,
                isPaused: false,
                currentGroup: 1,
                totalGroups: 5,
                groupDuration: 30,
                remainingSeconds: 30,
                timerId: null,
                audioCtx: null,
                inFinalFive: false,
                groupStarted: false,
            };

            // ---------- 音频工具 (音量 100%) ----------
            function getAudioContext() {
                if (!state.audioCtx) {
                    try {
                        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        console.warn('Web Audio 不可用');
                        return null;
                    }
                }
                if (state.audioCtx && state.audioCtx.state === 'suspended') {
                    state.audioCtx.resume().catch(e => {});
                }
                return state.audioCtx;
            }

            // 播放提示音，音量固定为 1.0 (100%)
            function playBeep(frequency = 880, duration = 0.14, volume = 1.0) {
                const ctx = getAudioContext();
                if (!ctx) return;
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = frequency;
                    // 音量直接设为 1.0 (100%)
                    gain.gain.value = Math.min(volume, 1.0);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration);
                } catch (e) { /* 静默 */ }
            }

            // 播报组数 (语音合成 + 提示音)
            function playGroupAnnounce(groupNumber) {
                // 语音合成音量也尽量调高 (浏览器限制最大1.0)
                try {
                    if (window.speechSynthesis) {
                        const utterance = new SpeechSynthesisUtterance(`第 ${groupNumber} 组`);
                        utterance.lang = 'zh-CN';
                        utterance.rate = 0.9;
                        utterance.pitch = 1.1;
                        utterance.volume = 1.0;   // 100%
                        window.speechSynthesis.speak(utterance);
                    }
                } catch (e) { /* 忽略 */ }

                // 提示音 100% 音量
                playBeep(660, 0.12, 1.0);
                setTimeout(() => { playBeep(880, 0.12, 1.0); }, 150);
            }

            // 最后5秒提示音 (100% 音量)
            function playFinalFiveBeep() {
                playBeep(1200, 0.08, 1.0);
            }

            // ---------- 界面更新 ----------
            function updateUI() {
                const mins = Math.floor(state.remainingSeconds / 60);
                const secs = state.remainingSeconds % 60;
                timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                groupBadge.textContent = `第 ${state.currentGroup} 组`;
            }

            function setStatus(msg, isError = false) {
                statusMessage.textContent = msg;
                statusMessage.style.color = isError ? '#f9a89e' : '#b0ccdf';
            }

            function updateButtons() {
                if (state.isRunning && !state.isPaused) {
                    startBtn.disabled = true;
                    pauseBtn.disabled = false;
                    pauseBtn.textContent = '⏸️ 暂停';
                } else if (state.isRunning && state.isPaused) {
                    startBtn.disabled = true;
                    pauseBtn.disabled = false;
                    pauseBtn.textContent = '▶️ 继续';
                } else {
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                    pauseBtn.textContent = '⏸️ 暂停';
                }
                if (state.currentGroup > state.totalGroups && !state.isRunning) {
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                }
                const inputsDisabled = state.isRunning || state.isPaused;
                groupDurationInput.disabled = inputsDisabled;
                totalGroupsInput.disabled = inputsDisabled;
            }

            // ---------- 核心逻辑 ----------
            function hardReset() {
                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }
                state.isRunning = false;
                state.isPaused = false;
                state.inFinalFive = false;
                state.groupStarted = false;

                let total = parseInt(totalGroupsInput.value, 10);
                if (isNaN(total) || total < 1) total = 5;
                let duration = parseInt(groupDurationInput.value, 10);
                if (isNaN(duration) || duration < 1) duration = 30;
                state.totalGroups = total;
                state.groupDuration = duration;
                state.currentGroup = 1;
                state.remainingSeconds = duration;

                updateUI();
                setStatus('已重置 · 准备开始');
                updateButtons();
                if (window.speechSynthesis) window.speechSynthesis.cancel();
            }

            function finishAllGroups() {
                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }
                state.isRunning = false;
                state.isPaused = false;
                state.inFinalFive = false;
                state.groupStarted = false;
                timerDisplay.textContent = '🎉 完成';
                groupBadge.textContent = `🏁 全部结束`;
                setStatus('所有组已完成！');
                // 完成提示音 100%
                playBeep(520, 0.5, 1.0);
                setTimeout(() => playBeep(660, 0.5, 1.0), 300);
                updateButtons();
                groupDurationInput.disabled = false;
                totalGroupsInput.disabled = false;
            }

            function startNextGroup() {
                if (state.currentGroup > state.totalGroups) {
                    finishAllGroups();
                    return;
                }

                playGroupAnnounce(state.currentGroup);

                state.remainingSeconds = state.groupDuration;
                state.inFinalFive = false;
                state.groupStarted = true;
                state.isRunning = true;
                state.isPaused = false;

                updateUI();
                setStatus(`第 ${state.currentGroup} 组 进行中`);
                if (state.currentGroup === state.totalGroups) {
                    setStatus(`最后一组！`);
                }

                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }

                state.timerId = setInterval(() => {
                    if (state.isPaused) {
                        return;
                    }

                    state.remainingSeconds -= 1;

                    if (state.remainingSeconds <= 5 && state.remainingSeconds > 0) {
                        if (!state.inFinalFive) {
                            state.inFinalFive = true;
                        }
                        playFinalFiveBeep(); // 100% 音量
                    } else {
                        if (state.remainingSeconds > 5) {
                            state.inFinalFive = false;
                        }
                    }

                    updateUI();

                    if (state.remainingSeconds <= 0) {
                        clearInterval(state.timerId);
                        state.timerId = null;

                        state.currentGroup += 1;
                        state.inFinalFive = false;
                        state.groupStarted = false;

                        if (state.currentGroup > state.totalGroups) {
                            finishAllGroups();
                        } else {
                            startNextGroup();
                        }
                    }
                }, 1000);

                updateButtons();
            }

            // ---------- 事件处理 ----------
            function onStart() {
                if (state.isRunning) return;

                const ctx = getAudioContext();
                if (ctx && ctx.state === 'suspended') ctx.resume().catch(e => {});

                let total = parseInt(totalGroupsInput.value, 10);
                if (isNaN(total) || total < 1) total = 5;
                let duration = parseInt(groupDurationInput.value, 10);
                if (isNaN(duration) || duration < 1) duration = 30;
                state.totalGroups = total;
                state.groupDuration = duration;

                state.currentGroup = 1;
                state.remainingSeconds = duration;
                state.inFinalFive = false;
                state.isPaused = false;
                state.isRunning = true;

                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }

                startNextGroup();
            }

            function onPauseToggle() {
                if (!state.isRunning) return;
                if (state.currentGroup > state.totalGroups) {
                    pauseBtn.disabled = true;
                    return;
                }

                state.isPaused = !state.isPaused;
                if (state.isPaused) {
                    setStatus('⏸️ 已暂停');
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                } else {
                    setStatus(`第 ${state.currentGroup} 组 继续`);
                    const ctx = getAudioContext();
                    if (ctx && ctx.state === 'suspended') ctx.resume().catch(e => {});
                }
                updateButtons();
                pauseBtn.textContent = state.isPaused ? '▶️ 继续' : '⏸️ 暂停';
            }

            function onReset() {
                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }
                state.isRunning = false;
                state.isPaused = false;
                state.inFinalFive = false;
                state.groupStarted = false;

                let total = parseInt(totalGroupsInput.value, 10);
                if (isNaN(total) || total < 1) total = 5;
                let duration = parseInt(groupDurationInput.value, 10);
                if (isNaN(duration) || duration < 1) duration = 30;
                state.totalGroups = total;
                state.groupDuration = duration;
                state.currentGroup = 1;
                state.remainingSeconds = duration;

                updateUI();
                setStatus('已重置');
                updateButtons();
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                groupDurationInput.disabled = false;
                totalGroupsInput.disabled = false;
            }

            function clampInputs() {
                let d = parseInt(groupDurationInput.value, 10);
                if (isNaN(d) || d < 1) groupDurationInput.value = 1;
                if (d > 999) groupDurationInput.value = 999;
                let t = parseInt(totalGroupsInput.value, 10);
                if (isNaN(t) || t < 1) totalGroupsInput.value = 1;
                if (t > 99) totalGroupsInput.value = 99;
            }

            // ---------- 绑定 ----------
            startBtn.addEventListener('click', onStart);
            pauseBtn.addEventListener('click', onPauseToggle);
            resetBtn.addEventListener('click', onReset);
            groupDurationInput.addEventListener('change', clampInputs);
            totalGroupsInput.addEventListener('change', clampInputs);

            window.addEventListener('load', function() {
                hardReset();
                setTimeout(() => { getAudioContext(); }, 500);
            });

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    const ctx = getAudioContext();
                    if (ctx && ctx.state === 'suspended') ctx.resume().catch(e => {});
                }
            });

            window.addEventListener('beforeunload', function() {
                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }
                if (window.speechSynthesis) window.speechSynthesis.cancel();
            });
        })();
    </script>
</body>
</html>
